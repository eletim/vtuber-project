<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>羽月こま · Control Room</title><link rel="stylesheet" href="/web/style.css">
<body><header><div><small>KOMA / VTUBER PROJECT</small><h1>羽月こま <span>Control Room</span></h1></div><div id="connection">接続中…</div></header>
<main><section class="stage"><div class="stage-label">LIVE PREVIEW <span id="fps"></span></div><canvas id="avatar" width="652" height="869"></canvas><div id="subtitle"></div><div class="stage-footer"><span id="mode-label">人間操作</span><span>羽月こま / PSDパーツモデル</span></div></section>
<aside><section><h2>コントロール</h2><div class="tabs"><button id="human" class="selected">人間</button><button id="ai">AI</button></div><p id="hint">スライダー・カメラ・マイクで動かせます。</p></section>
<section><h2>顔と表情</h2><div id="sliders"></div><div class="row"><button id="blink">まばたき</button><button id="reset">リセット</button></div><label class="check"><input type="checkbox" id="autoblink" checked>自動まばたき</label></section>
<section><h2>人間の入力</h2><div class="row"><button id="camera">カメラ開始</button><button id="microphone">マイク開始</button></div><p id="tracking">カメラ・マイクは停止中</p><video id="video" autoplay muted playsinline hidden></video></section>
<section><h2>AIの入力</h2><textarea id="speech" rows="2">こんにちは、羽月こまです。一緒に将棋を楽しみましょう。</textarea><div class="row"><button id="speak">読み上げ</button><button id="demo">AI動作デモ</button></div><label class="file">音声ファイルでリップシンク<input id="audiofile" type="file" accept="audio/*"></label><audio id="audio" controls></audio><p id="audio-status">読み上げは端末の音声合成を使用します。</p></section>
<section><h2>配信画面</h2><select id="background"><option value="studio">スタジオ</option><option value="green">グリーン</option><option value="transparent">透明</option></select><a href="/?overlay=1" target="_blank">配信用画面を開く ↗</a></section>
<p id="status" role="status">モデルを読み込んでいます。</p><small class="footnote">Cubism形式の書き出しは準備中。この画面はPSD由来のパーツと変形で動きます。</small></aside></main>
<script type="module" src="/web/app.js"></script></body></html>
